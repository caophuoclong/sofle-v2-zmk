# Right half is the peripheral. It keeps its own underglow state in sync with
# the central (the underglow behavior is forwarded with absolute values), so it
# can show the current hue/saturation/brightness/effect on its own screen.
CONFIG_NICE_OLED_WIDGET_RGB_STATUS=y

# Position is tunable without touching the module's code - adjust these if the
# text overlaps the peripheral animation on the 128x32 panel.
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_Y=64
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_LINE_HEIGHT=10
