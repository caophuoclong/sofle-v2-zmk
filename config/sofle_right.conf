# Right half is the peripheral.
#
# The canvas stays at the module default (68x160). After the 90 degree rotation
# only canvas x < 32 and y > 32 land on the 128x32 panel, so everything below
# is kept inside that band.

# The peripheral art is a 69x68 image drawn on top of the canvas, which covers
# almost all of a 32px tall panel. Drop it so the actual status is readable.
CONFIG_NICE_OLED_WIDGET_PERIPHERAL_NO_ART=y

# It keeps its own underglow state in sync with the central (the underglow
# behavior is forwarded with absolute values), so it can show the current
# hue/saturation/brightness/effect on its own screen.
CONFIG_NICE_OLED_WIDGET_RGB_STATUS=y
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_FONT_16=y
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_Y=64
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_LINE_HEIGHT=14

# Name shown under the underglow values. Only about 4 characters fit across the
# visible band at 12px - switch to _FONT_8=y if you want a longer one.
CONFIG_NICE_OLED_WIDGET_NAME_TAG=y
CONFIG_NICE_OLED_WIDGET_NAME_TAG_TEXT="LEON"
CONFIG_NICE_OLED_WIDGET_NAME_TAG_FONT_16=y
CONFIG_NICE_OLED_WIDGET_NAME_TAG_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_NAME_TAG_CUSTOM_Y=126
