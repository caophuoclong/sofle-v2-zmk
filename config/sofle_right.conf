# Right half is the peripheral.

# The module defaults to a 68x160 canvas (sized for nice!view panels), but this
# board has a 128x32 OLED. Without this the widgets are drawn outside the
# visible area and only the art layer shows up.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# The peripheral art is a 69x68 image drawn on top of the canvas, which covers
# almost all of a 32px tall panel. Drop it so the actual status is readable.
CONFIG_NICE_OLED_WIDGET_PERIPHERAL_NO_ART=y

# It keeps its own underglow state in sync with the central (the underglow
# behavior is forwarded with absolute values), so it can show the current
# hue/saturation/brightness/effect on its own screen.
CONFIG_NICE_OLED_WIDGET_RGB_STATUS=y

# Position is tunable without touching the module's code.
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_CUSTOM_Y=64
CONFIG_NICE_OLED_WIDGET_RGB_STATUS_LINE_HEIGHT=10
