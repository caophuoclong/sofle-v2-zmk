# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_STUDIO_LOCKING=n

# ── Custom OLED Display (zmk-nice-oled module) ──────────────
# The nice_oled shield renders its own custom status screen (LVGL-based),
# replacing ZMK's built-in status widgets, so the standard
# CONFIG_ZMK_WIDGET_* options are not used here.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Central (the half plugged into USB) shows layer name, a numeric WPM
# reading, and modifier/caps-lock indicators.
# NOTE: CONFIG_ZMK_WPM is intentionally NOT set here. ZMK only compiles the
# `keycode_state_changed` event on the central half, but unconditionally
# compiles src/wpm.c whenever CONFIG_ZMK_WPM=y regardless of split role, so
# enabling it here (shared by both halves) breaks the peripheral link. It's
# set in sofle_left.conf instead, which only applies to the central half.
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y

# ── RGB Underglow (WS2812) ───────────────────────────────────
# LED strip is declared per-half in sofle_left.overlay / sofle_right.overlay
# (data line on pro_micro pin D6, 27 LEDs per side).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=270
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=5
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# ZMK waits this long after the last change before writing settings to flash.
# The default is 60 seconds, which loses underglow (and other) changes if the
# keyboard is switched off sooner than that. The delay still coalesces a burst
# of changes into one write, so flash wear stays bounded.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=3000

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
