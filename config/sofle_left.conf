# Left half is central (plugged into USB) - only build the WPM event/source
# on this half, since ZMK only compiles the keycode_state_changed event
# listener for the central role.
CONFIG_ZMK_WPM=y

# Persist the WIN layer (layer 4, macOS/Windows mode toggle) across power
# cycles. Central-only, same reasoning as CONFIG_ZMK_WPM above.
CONFIG_NICE_OLED_PERSISTENT_LAYER=y
CONFIG_NICE_OLED_PERSISTENT_LAYER_ID=4
