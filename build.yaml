# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano_v2
    shield: sofle_left nice_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: sofle_right nice_oled
  # Diagnostic build for the flaky bottom row: same keymap, but with the
  # underglow and the display compiled out, so nothing custom touches a GPIO or
  # the SPI bus. If a row still drops out on this, the cause is not the config.
  - board: nice_nano_v2
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_RGB_UNDERGLOW=n -DCONFIG_ZMK_DISPLAY=n -DCONFIG_WS2812_STRIP=n
    artifact-name: sofle_left_bare
  - board: nice_nano_v2
    shield: settings_reset
